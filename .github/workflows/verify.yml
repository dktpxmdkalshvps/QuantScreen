name: Verify
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app alembic
      - run: python -c "import app.main"
  tracked-file-names:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject tracked runtime files without printing contents
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)(\.env(\..+)?|local\.db|quantscreen\.db|[^/]+\.(sqlite|sqlite3|db))$' | grep -Ev '(^|/)\.env\.example$' >/dev/null; then
            echo 'Tracked runtime file detected. Review tracked file names locally.'
            exit 1
          fi

  forecast-phase2:
    name: Forecast phase2 temporal and reproducibility tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: experiments/forecast-benchmark/phase2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: experiments/forecast-benchmark/phase2/requirements.txt
      - name: Install forecast test dependencies
        run: python -m pip install -r requirements.txt
      - name: Run temporal integrity and deterministic model tests
        run: python -m unittest discover -s . -p 'test_*.py' -v
